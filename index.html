<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Resume Parser & ATS Analyzer</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>📄 Resume Parser & ATS Analyzer</h1>
    <nav id="tabs">
      <button data-tab="analyze" class="active">Analyze</button>
      <button data-tab="bulk">Bulk & Rank</button>
      <button data-tab="dashboard">Dashboard</button>
      <button data-tab="auth">Login / Register</button>
    </nav>
    <span id="auth-status">Not logged in</span>
  </header>

  <main>
    <section id="analyze" class="tab active">
      <h2>Single Resume Analysis</h2>
      <input type="file" id="resume-file" accept=".pdf,.docx">
      <textarea id="jd-text" placeholder="Paste a job description here (optional, enables JD match + skill gap)"></textarea>
      <button id="analyze-btn">Analyze Resume</button>
      <div id="analyze-result"></div>
    </section>

    <section id="bulk" class="tab">
      <h2>Bulk Parsing & Ranking</h2>
      <input type="file" id="bulk-files" accept=".pdf,.docx" multiple>
      <textarea id="bulk-jd-text" placeholder="Paste job description to rank candidates against it (optional)"></textarea>
      <button id="bulk-btn">Parse & Rank All</button>
      <div id="bulk-result"></div>
    </section>

    <section id="dashboard" class="tab">
      <h2>Dashboard</h2>
      <p>Log in to see your parsing history and analytics.</p>
      <div id="dashboard-stats"></div>
      <canvas id="skills-chart" width="400" height="250"></canvas>
    </section>

    <section id="auth" class="tab">
      <h2>Account</h2>
      <div class="auth-forms">
        <div>
          <h3>Login</h3>
          <input id="login-username" placeholder="Username">
          <input id="login-password" type="password" placeholder="Password">
          <button id="login-btn">Log In</button>
        </div>
        <div>
          <h3>Register</h3>
          <input id="register-username" placeholder="Username">
          <input id="register-password" type="password" placeholder="Password">
          <button id="register-btn">Register</button>
        </div>
      </div>
      <div id="auth-message"></div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
