<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Parser</title>
<style>
  :root{
    --bg:#FAF9F6; --ink:#1B1B19; --ink-soft:#5B5A55;
    --accent:#1F3864; --line:#E3E0D8; --paper:#fff; --ok:#2E7D32; --err:#B3261E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Segoe UI', Arial, sans-serif; background:var(--bg); color:var(--ink); padding:40px 20px;}
  .wrap{max-width:760px; margin:0 auto;}
  h1{font-size:28px; margin-bottom:6px;}
  .sub{color:var(--ink-soft); margin-bottom:32px; font-size:15px;}
  .dropzone{
    border:2px dashed var(--line); border-radius:8px; padding:40px 20px;
    text-align:center; background:var(--paper); cursor:pointer; transition:border-color .15s;
  }
  .dropzone.dragover{border-color:var(--accent); background:#F1F4F9;}
  .dropzone p{color:var(--ink-soft); margin-top:8px; font-size:14px;}
  .dropzone strong{color:var(--accent);}
  input[type=file]{display:none;}
  .filename{margin-top:14px; font-size:14px; font-weight:600; color:var(--accent);}
  button#parseBtn{
    margin-top:20px; width:100%; padding:13px; background:var(--accent); color:#fff;
    border:none; border-radius:5px; font-size:15px; font-weight:600; cursor:pointer;
  }
  button#parseBtn:disabled{opacity:0.5; cursor:not-allowed;}
  #status{margin-top:14px; font-size:14px;}
  #status.error{color:var(--err);}
  #status.ok{color:var(--ok);}
  #result{margin-top:32px; display:none;}
  .card{background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:24px; margin-bottom:16px;}
  .card h2{font-size:15px; text-transform:uppercase; letter-spacing:0.04em; color:var(--accent); margin-bottom:12px;}
  .field{display:flex; gap:10px; margin-bottom:8px; font-size:14.5px;}
  .field span:first-child{color:var(--ink-soft); min-width:70px;}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{background:#F1EFE9; border:1px solid var(--line); padding:4px 10px; border-radius:3px; font-size:13px;}
  pre{white-space:pre-wrap; font-size:13.5px; color:var(--ink-soft); font-family:inherit;}
  .empty{color:var(--ink-soft); font-style:italic; font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Resume Parser</h1>
  <p class="sub">Upload a PDF or DOCX resume to extract key candidate details automatically.</p>

  <div class="dropzone" id="dropzone">
    <p><strong>Click to upload</strong> or drag and drop a file here</p>
    <p>PDF or DOCX, max 5MB</p>
    <input type="file" id="fileInput" accept=".pdf,.docx">
    <div class="filename" id="filename"></div>
  </div>

  <button id="parseBtn" disabled>Parse Resume</button>
  <div id="status"></div>

  <div id="result">
    <div class="card">
      <h2>Contact</h2>
      <div class="field"><span>Name</span><span id="r-name"></span></div>
      <div class="field"><span>Email</span><span id="r-email"></span></div>
      <div class="field"><span>Phone</span><span id="r-phone"></span></div>
      <div class="field"><span>LinkedIn</span><span id="r-linkedin"></span></div>
      <div class="field"><span>GitHub</span><span id="r-github"></span></div>
    </div>
    <div class="card">
      <h2>Skills</h2>
      <div class="chips" id="r-skills"></div>
    </div>
    <div class="card">
      <h2>Education</h2>
      <pre id="r-education"></pre>
    </div>
    <div class="card">
      <h2>Experience</h2>
      <pre id="r-experience"></pre>
    </div>
  </div>
</div>

<script>
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const filenameEl = document.getElementById('filename');
  const parseBtn = document.getElementById('parseBtn');
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');

  let selectedFile = null;

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', e => {
    if (e.target.files.length) handleFile(e.target.files[0]);
  });

  function handleFile(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (!['pdf', 'docx'].includes(ext)) {
      setStatus('Please upload a .pdf or .docx file.', 'error');
      return;
    }
    selectedFile = file;
    filenameEl.textContent = file.name;
    parseBtn.disabled = false;
    setStatus('', '');
    resultEl.style.display = 'none';
  }

  function setStatus(msg, type) {
    statusEl.textContent = msg;
    statusEl.className = type;
  }

  parseBtn.addEventListener('click', async () => {
    if (!selectedFile) return;
    parseBtn.disabled = true;
    setStatus('Parsing resume…', '');

    const formData = new FormData();
    formData.append('resume', selectedFile);

    try {
      const res = await fetch('/api/parse', { method: 'POST', body: formData });
      const data = await res.json();

      if (!res.ok) {
        setStatus(data.error || 'Something went wrong.', 'error');
        parseBtn.disabled = false;
        return;
      }

      renderResult(data.data);
      setStatus('Parsed successfully.', 'ok');
    } catch (err) {
      setStatus('Could not reach the server. Is the backend running?', 'error');
    }
    parseBtn.disabled = false;
  });

  function renderResult(d) {
    document.getElementById('r-name').textContent = d.name || '—';
    document.getElementById('r-email').textContent = d.email || '—';
    document.getElementById('r-phone').textContent = d.phone || '—';
    document.getElementById('r-linkedin').textContent = d.linkedin || '—';
    document.getElementById('r-github').textContent = d.github || '—';

    const skillsEl = document.getElementById('r-skills');
    skillsEl.innerHTML = '';
    if (d.skills && d.skills.length) {
      d.skills.forEach(s => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = s;
        skillsEl.appendChild(chip);
      });
    } else {
      skillsEl.innerHTML = '<span class="empty">No recognized skills found.</span>';
    }

    document.getElementById('r-education').textContent = d.education || 'Not found';
    document.getElementById('r-experience').textContent = d.experience || 'Not found';

    resultEl.style.display = 'block';
  }
</script>
</body>
</html>
